name: Update Reviews

on:
  # Run every 3 months (quarterly) on the 1st day at 00:00 UTC
  schedule:
    - cron: '0 0 1 */3 *'  # Jan 1, Apr 1, Jul 1, Oct 1

  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run review scraper
        run: |
          python scripts/scrape_reviews.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/reviews.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Update patient reviews from iwantgreatcare.org'
          title: 'Update Patient Reviews'
          body: |
            ## Automated Review Update

            This PR updates the patient testimonials from [iwantgreatcare.org](https://www.iwantgreatcare.org/doctors/miss-devanna-rajeswari).

            ### Changes
            - Updated top 3 reviews in `src/data/reviews.json`

            ### Review Instructions
            Please review the new testimonials to ensure:
            - Reviews are appropriate and professional
            - No sensitive information is included
            - Quotes are properly formatted

            This is an automated update that runs quarterly.
          branch: update-reviews
          delete-branch: true
          labels: |
            automated
            content-update
